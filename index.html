<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiesole Calcio - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e0ffe0, #c4f0c5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #004d26;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
        }

        section {
            text-align: center;
        }

        h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .buttons button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 12px;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .buttons button:hover {
            background-color: #1b5e20;
            transform: scale(1.05);
        }

        .buttons button:active {
            transform: scale(0.98);
        }

        @media (min-width: 600px) {
            .buttons {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://imgs.search.brave.com/c0OiWAxHxaB-e7oiHtuB0NgHwqclQdVgBHfL4J1ohCI/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jb250/ZW50LXMzLnR1dHRv/Y2FtcG8uaXQvVGVh/bXMvMTIwLzExNTE2/NzMucG5nP3Y9MQ" alt="Stemma Fiesole Calcio">
        <h1>Benvenuti su Fiesole Calcio</h1>
    </header>

    <section>
        <h2>Seleziona un'azione</h2>
        <div class="buttons">
            <button onclick="location.href='ag1.html'">Aggiungi Gara</button>
            <button onclick="location.href='presenze.html'">Consulta Presenze</button>
            <button onclick="location.href='info.html'">Informazioni</button>
        </div>
    </section>

</body>
</html>
